<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        max-width: 400px;
        margin: 50px auto;
        padding: 20px;
      }
      .form-group {
        margin-bottom: 15px;
      }
      label {
        display: block;
        margin-bottom: 5px;
        font-weight: bold;
      }
      input {
        width: 100%;
        padding: 8px;
        box-sizing: border-box;
        border: 1px solid #ccc;
        border-radius: 4px;
      }
      button {
        width: 100%;
        padding: 10px;
        background-color: #007bff;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-size: 16px;
      }
      button:hover {
        background-color: #0056b3;
      }
      #message {
        margin-top: 15px;
        font-weight: bold;
        text-align: center;
      }
      .error {
        color: #dc3545;
      }
      .success {
        color: #28a745;
      }
      .link {
        margin-top: 15px;
        text-align: center;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <h2>Login</h2>

    <form id="loginForm">
      <div class="form-group">
        <label for="email">Email:</label>
        <input type="email" id="email" required />
      </div>
      <div class="form-group">
        <label for="password">Password:</label>
        <input type="password" id="password" required />
      </div>
      <button type="submit">Login</button>
    </form>

    <div id="message"></div>
    <div class="link">
      <a href="/index.html">Don't have an account? Register here</a>
    </div>

    <script>
      document
        .getElementById("loginForm")
        .addEventListener("submit", function (e) {
          e.preventDefault(); // Prevent page refresh

          const messageDiv = document.getElementById("message");
          messageDiv.textContent = "Logging in...";
          messageDiv.className = "";

          const email = document.getElementById("email").value;
          const password = document.getElementById("password").value;

          const formData = new URLSearchParams();
          formData.append("email", email);
          formData.append("password", password);

          fetch("/api/login", {
            method: "POST",
            headers: {
              "Content-Type": "application/x-www-form-urlencoded",
            },
            body: formData.toString(),
          })
            .then((response) => {
              // Strictly evaluate status code with zero body dependency
              if (response.status === 200) {
                messageDiv.textContent = "Login successful!";
                messageDiv.className = "success";
              } else if (response.status === 401) {
                messageDiv.textContent = "Invalid email or password.";
                messageDiv.className = "error";
              } else if (response.status === 400) {
                messageDiv.textContent = "Missing required fields.";
                messageDiv.className = "error";
              } else {
                messageDiv.textContent = "An error occurred. Please try again.";
                messageDiv.className = "error";
              }
            })
            .catch((error) => {
              messageDiv.textContent = "Network error. Is the server running?";
              messageDiv.className = "error";
            });
        });
    </script>
  </body>
</html>
